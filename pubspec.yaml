name: clean_tracker
description: "A local-first abstinence & recovery tracker. No account, no cloud."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Charts (mood history)
  fl_chart: ^0.69.0

  # Persistence
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Launch tel: for the emergency-contact urge technique
  url_launcher: ^6.3.0

  # Local notifications for milestone reminders (no network involved).
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Render + share a milestone graphic; also used for JSON export.
  screenshot: ^3.0.0
  share_plus: ^10.1.0

  # Data ownership: pick a JSON file to import; optional biometric app lock.
  file_picker: ^8.1.2
  local_auth: ^2.3.0

  # Android home-screen widgets (time / money / urge / dashboard). Pinned to
  # 0.7.0 on purpose — it sits in a narrow compatibility window:
  #  * 0.7.0's module is compileSdk 34 / glance 1.0.0, so it respects this
  #    project's deliberate compileSdk-34 pinning (see the note below). 0.8.0+
  #    jump to compileSdk 35 / glance 1.+ and would break it.
  #  * yet it is new enough to use the current ViewConfiguration(logicalConstraints:)
  #    API — 0.4.x still called ViewConfiguration(size:), which this Flutter
  #    removed, so the older release failed to compile.
  # It needs no extra permissions (the widgets read only locally-stored data).
  home_widget: 0.7.0

  # Formatting / i18n
  intl: any

# path_provider_android 2.3.x switched its implementation to JNI bindings, and
# jni 1.0.1's Android Gradle script is incompatible with the current Flutter
# Gradle plugin ("Could not find method kotlin()"), breaking the release APK
# build. Pin to the last pre-JNI release until the ecosystem catches up.
#
# flutter_plugin_android_lifecycle (pulled by file_picker + local_auth) bumped
# its AAR metadata to require compileSdk 35 at 2.0.25, which the plugin modules
# (fixed at Flutter's compileSdk 34) can't satisfy. 2.0.17 is too old (still
# ships the v1 embedding Registrar, removed at 2.0.20). Pin to 2.0.23: past the
# v1 removal, still compileSdk 34, so every plugin builds against 34 again.
dependency_overrides:
  path_provider_android: 2.2.23
  flutter_plugin_android_lifecycle: 2.0.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.19.1
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
