name: clean_tracker
description: "A local-first abstinence & recovery tracker. No account, no cloud."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Charts (mood history)
  fl_chart: ^0.69.0

  # Persistence
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Launch tel: for the emergency-contact urge technique
  url_launcher: ^6.3.0

  # Local notifications for milestone reminders (no network involved).
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Render + share a milestone graphic; also used for JSON export.
  screenshot: ^3.0.0
  share_plus: ^10.1.0

  # Data ownership: pick a JSON file to import; optional biometric app lock.
  file_picker: ^8.1.2
  local_auth: ^2.3.0

  # Formatting / i18n
  intl: any

# path_provider_android 2.3.x switched its implementation to JNI bindings, and
# jni 1.0.1's Android Gradle script is incompatible with the current Flutter
# Gradle plugin ("Could not find method kotlin()"), breaking the release APK
# build. Pin to the last pre-JNI release until the ecosystem catches up.
#
# flutter_plugin_android_lifecycle (pulled by file_picker + local_auth) bumped
# its AAR metadata to require compileSdk 36, which the plugin modules (fixed at
# Flutter's compileSdk 34) can't satisfy. Pin it to a pre-36 release so every
# plugin builds against 34 again.
dependency_overrides:
  path_provider_android: 2.2.23
  flutter_plugin_android_lifecycle: 2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.19.1
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
